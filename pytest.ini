[pytest]
DJANGO_SETTINGS_MODULE = plane.settings.production_ai
python_files = test_*.py
testpaths = ai/tests
# `--reuse-db` skips schema setup when the DB already has the planeAI
# tables (which it does once the migrator has run). Without this each
# pytest run would re-execute all of Plane's 0001..N migrations and
# pgvector CREATE EXTENSION, multiplying CI time by ~3x.
addopts = --reuse-db --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
