[pytest]
DJANGO_SETTINGS_MODULE = plane.settings.production_ai
python_files = test_*.py
testpaths = ai/tests
# `--reuse-db` skips schema setup when the DB already has the planeAI
# tables (which it does once the migrator has run). Without this each
# pytest run would re-execute all of Plane's 0001..N migrations and
# pgvector CREATE EXTENSION, multiplying CI time by ~3x.
# PR pipeline excludes integration tests so each PR stays hermetic.
# Override with `pytest -m llm_integration ...` when ANTHROPIC_API_KEY
# is set (see ai/tests/test_injection.py).
addopts = --reuse-db --tb=short -m "not llm_integration"
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    llm_integration: hits the real Anthropic / OpenAI API. Skipped on
        PR pytest; run via the nightly workflow with secrets.
