# TZ 6.2 — Alertmanager configuration.
#
# One webhook receiver pointed at our own Django endpoint
# (/api/ai/alerts/webhook/). The endpoint reshapes the payload for
# the team's chat (Slack / Telegram / Discord — vendor selected
# server-side via ALERT_WEBHOOK_FORMAT). This indirection has two
# upsides:
#
#   1. Alertmanager config is vendor-agnostic — switching from
#      Slack to Telegram is a Django env change, not an Alertmanager
#      restart.
#   2. The Django side can dedupe / silence per-workspace alerts
#      using its own DB if the team eventually wants smarter routing.
#
# Group_wait / group_interval / repeat_interval are tuned for an
# operator-attended team:
#   - 30s group_wait: cluster the burst before paging,
#   - 5m group_interval: send updates if new alerts join the group,
#   - 2h repeat_interval: keep nagging if nobody resolved.

global:
  resolve_timeout: 5m

route:
  receiver: planeai-webhook
  group_by: ["alertname", "workspace_id"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    # Critical alerts re-page every 30m instead of every 2h.
    - matchers:
        - severity = "critical"
      receiver: planeai-webhook
      repeat_interval: 30m

receivers:
  - name: planeai-webhook
    webhook_configs:
      - url: ${PLANEAI_ALERTMANAGER_TARGET_URL}
        send_resolved: true
        http_config:
          # Static shared-secret header matched server-side by
          # ALERT_WEBHOOK_TOKEN. Alertmanager substitutes ${VAR}
          # from its own environment via the systemd unit / compose
          # service env.
          authorization:
            type: Bearer
            credentials: ${PLANEAI_ALERT_WEBHOOK_TOKEN}

# Inhibition: a critical budget alert silences the warning one so the
# operator only sees ONE chat message per fire.
inhibit_rules:
  - source_matchers:
      - alertname = "PlaneAIBudgetCritical"
    target_matchers:
      - alertname = "PlaneAIBudgetWarning"
    equal: ["workspace_id"]
