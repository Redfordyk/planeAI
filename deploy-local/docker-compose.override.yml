# Local overrides on top of deploy-local/docker-compose.yml
#
# 1. plane-db — swap default postgres:15.7-alpine for the pgvector image
#    pinned to 0.8.2 (TZ 0.4 / CVE-2026-3172 fix).
# 2. api / worker / beat-worker / migrator — use our custom image that
#    bakes in the `ai` Django app and ML deps (TZ 0.5). Same image
#    everywhere so Celery tasks and hooks defined in `ai` are visible
#    to all backend services. DJANGO_SETTINGS_MODULE points at the
#    settings shim that appends `ai` to INSTALLED_APPS.

services:
  plane-db:
    image: pgvector/pgvector:0.8.2-pg15

  api:
    image: plane-backend-ai:local
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.production_ai
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}

  worker:
    image: plane-backend-ai:local
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.production_ai
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}

  beat-worker:
    image: plane-backend-ai:local
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.production_ai
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}

  migrator:
    image: plane-backend-ai:local
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.production_ai
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}

  # --- PGTU conference (additive): route pgtu.site.volodyatvoybank.com.ru
  #     through Plane's Caddy. Mounts an extended Caddyfile (Plane original +
  #     one extra vhost) and adds host.docker.internal so Caddy can reach the
  #     conference nginx published on the host at :8080. Plane routing unchanged.
  proxy:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - proxy_config:/config
      - proxy_data:/data
      - /opt/pgtu-site/proxy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
